
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Browse diagnostic tests at Anmol Lab.">
<title>All Tests | Anmol Lab</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>

<body>

<div id="site-header"></div>

<main>


<!-- My Tests Summary Bar -->
<div id="my-tests-summary" class="my-tests-summary d-none">
  <div class="container d-flex justify-content-between align-items-center gap-3">
    <span>
      <strong id="my-tests-count">0</strong> tests selected
    </span>
    <button class="btn btn-accent" type="button"
            data-bs-toggle="offcanvas"
            data-bs-target="#myTestsOffcanvas">
      View My Tests
    </button>
  </div>
</div>

<!-- Test Details Modal -->
<div class="modal fade" id="testDetailsModal" tabindex="-1"
     aria-labelledby="testDetailsTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="testDetailsTitle">Test Details</h5>
        <button type="button" class="btn-close"
                data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="test-details-content"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary-lab"
                id="modal-add-test">
          Add to My Tests
        </button>
        <button type="button" class="btn btn-secondary"
                data-bs-dismiss="modal">
          Close
        </button>
      </div>
    </div>
  </div>
</div>

<!-- My Tests Offcanvas -->
<div class="offcanvas offcanvas-end" tabindex="-1"
     id="myTestsOffcanvas" aria-labelledby="myTestsTitle">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="myTestsTitle">My Tests</h5>
    <button type="button" class="btn-close"
            data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body">
    <div id="my-tests-list">
      <p class="text-muted">No tests selected yet.</p>
    </div>
    <hr>
    <p class="fw-bold mb-0">
      Selected tests: <span id="offcanvas-tests-count">0</span>
    </p>
  </div>
</div>
</main>


<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>

<script src="js/tests.js"></script>
<script src="js/packages.js"></script>
<script src="js/main.js"></script>
<script src="js/tests-page.js"></script>

</body>
</html>
