
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Browse diagnostic tests at Anmol Lab.">
<title>All Tests | Anmol Lab</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>

<body>

<div id="site-header"></div>

<main>

<section class="page-banner">
<div class="container">
<h1>All Tests</h1>
<nav aria-label="breadcrumb">
<ol class="breadcrumb">
<li class="breadcrumb-item"><a href="index.html">Home</a></li>
<li class="breadcrumb-item active">Tests</li>
</ol>
</nav>
</div>
</section>

<section class="section">
<div class="container">

<!-- Search and filters -->
<div class="row g-3 mb-4">

<div class="col-lg-5">
<input type="search" id="test-search"
class="form-control"
placeholder="Search CBC, Sugar, Thyroid...">
</div>

<div class="col-md-4 col-lg-2">
<select id="category-filter" class="form-select">
<option value="all">All Categories</option>
</select>
</div>

<div class="col-md-4 col-lg-2">
<select id="fasting-filter" class="form-select">
<option value="all">All Fasting</option>
<option value="yes">Fasting Required</option>
<option value="no">No Fasting</option>
</select>
</div>

<div class="col-md-4 col-lg-3">
<select id="sort-filter" class="form-select">
<option value="default">Default Sorting</option>
<option value="name">Name (A to Z)</option>
<option value="low">Price (Low to High)</option>
<option value="high">Price (High to Low)</option>
</select>
</div>

</div>

<div class="row g-4">

<!-- Categories -->
<aside class="col-lg-3">
<h2 class="h5 mb-3">Categories</h2>
<div id="category-list" class="category-list"></div>
</aside>

<!-- Test cards -->
<div class="col-lg-9">

<p id="results-count" class="text-muted">Showing tests</p>

<div class="row g-3" id="tests-grid"></div>

<div id="no-results" class="text-center py-5" hidden>
<h3 class="h5">Test not found</h3>
<p>Send us your prescription on WhatsApp and we'll help.</p>
<a href="#" id="no-results-wa" class="btn btn-primary-lab">
<i class="fa-brands fa-whatsapp"></i> WhatsApp
</a>
<button id="clear-filters" class="btn btn-outline-secondary">
Clear filters
</button>
</div>

<div class="text-center mt-4">
<button id="load-more" class="btn btn-primary-lab">
Load More
</button>
</div>

</div>
</div>

</div>
</section>

</main>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>

<script src="js/tests.js"></script>
<script src="js/packages.js"></script>
<script src="js/main.js"></script>
<script src="js/tests-page.js"></script>

</body>
</html>
